transition_semantics:
  atomic: Событие и показанное изменение UI; не означает подтверждённую реализацию.
  request_result: Показанный результат запроса. guard описывает только условие этого примера.
  summarized: 'Стрелка пропускает промежуточную работу: to достигается только после указанного результата, не сразу по
    нажатию.'
  example: Смена демонстрационного запроса и итог выдачи; не обязательный шаг пользовательского пути.
  ambiguous: Смысл частично понятен, но источник/момент события не установлен. Не реализовывать буквально до ответа на
    question.
  unlisted: Непоказанные переходы не запрещены и не разрешены этим документом; их поведение неизвестно.
