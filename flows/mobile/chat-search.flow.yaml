visual_evidence:
  mapping_method: Прочитаны текущие IDs, подписи, геометрия и endpoints; визуально сопоставлены с картой. Имена стрелок
    содержат старые IDs и не используются как текущие ссылки.
  connector_url_prefix: https://www.figma.com/design/V1EKgtI2h6sOnE5MW9ZvoH?node-id=
  connector_id_rule: В figma_connectors используются текущие IDs; для URL заменить двоеточие дефисом и добавить connector_url_prefix.
  coverage: {screen_instances: 14, connector_nodes: 19, logical_connections: 17}
  split_connectors: Выходные отрезки 6064:87002 и 6064:87003 принадлежат open_chat и clear_query; это не отдельные события.
  missing_bindings: У ряда connector endpoints указан ID секции с координатой. Привязки triggers проверены отдельно;
    автоматический экспорт полноценной машины по endpoints невозможен.
