open_questions:
  Q01: 'Когда отправлять запрос: каждое изменение, debounce, минимальная длина, кнопка клавиатуры? Числовые параметры и поведение
    Action Button в подписях не определены.'
  Q02: Как отменять/игнорировать старые ответы при смене/очистке запроса и закрытии поиска? Правило для гонок не задано.
  Q03: Как показывать один завершённый и один ожидающий запрос; обратную частичную ошибку (чаты — ошибка, сообщения доступны)?
    Откуда фактически приходит ошибка в 11? Карта эти случаи не определяет.
  Q04: Что видно во время повторного поиска только сообщений; что делать при пустом/ошибочном повторном ответе? Стрелка
    11 → 06 изображает только успешный непустой итог.
  Q05: Каковы page key, размер страницы, порог запуска, конец списка, защита от повторного запуска, результат успешной
    подгрузки и устранение дубликатов? В карте показана только загрузка и ошибка страницы.
  Q06: 'Что происходит по Back/закрытию sheet и возврату из чата: запрос, результаты, scroll offset, фокус и клавиатура?
    Скрытие клавиатуры не доказывает снятие фокуса.'
  Q07: Haptic-аннотаций в 19 прочитанных стрелках нет. Это не решение отключить haptic; типы/моменты для этого сценария
    требуют отдельного разбора.
  Q08: Какой API выполняет поиск сообщений по всем чатам и каков его ответ? Найденный messagesSearchPageFetcher ограничен
    ChatParams.channelId; его нельзя объявлять реализацией глобального поиска.
  Q09: С какого события отсчитывать 1500 мс подсветки, что делать с удалённым/недоступным сообщением и как передать его
    якорь в маршрут? В карте задана длительность, но не эти детали.
