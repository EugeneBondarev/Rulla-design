# Пилот: сначала читать read_first. Поля и идентификаторы этого файла ещё не общий стандарт.
format_version: 0.1-pilot
id: mobile.chat_search
title: Поиск чатов и сообщений
status: pilot_for_review
platform: mobile
read_first:
- Это проверяемая текстовая модель показанного дизайна, а не исполняемый автомат или подтверждение реализации.
- Идентификаторы событий/эффектов ниже введены для пилота; они не являются именами существующих Dart-методов.
- views — снимки интерфейса, не отдельные Flutter routes. Состояния чатов, сообщений, страницы и клавиатуры независимы.
- snapshot содержит примеры данных и UI, а не полное присваивание состояния при переходе. pending_view — визуальный ориентир;
  клавиатуру/фокус менять только по явно заданному эффекту. Промежуточные снимки для остальных комбинаций не определены.
- Для смысла сначала читать views → effects → transitions → open_questions → acceptance_cases. visual_evidence — только
  трассировка.
- null означает неизвестное/неприменимое по пояснению поля; unknown — не установлено. Нельзя заполнять их догадками.
- При конфликте с новой Figma или кодом обновить доказательства и сообщить о расхождении; не считать этот снимок автоматически
  актуальным.
